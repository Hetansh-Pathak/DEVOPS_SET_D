# Requires generated/service.env, created by Terraform (see README: `terraform apply` in infra/).
services:
  library-api:
    build: .
    image: campus-library:local
    container_name: campus-library-api
    env_file:
      - generated/service.env
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
