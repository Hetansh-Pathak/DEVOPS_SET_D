apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-api
  namespace: devops-assessment
  labels:
    app: library-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: library-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A bad release can never take healthy Pods away: old Pods stay until new ones are Ready.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: library-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: library-api
          image: campus-library:1.0.0
          imagePullPolicy: IfNotPresent   # image is loaded into kind/minikube, not pulled
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: library-api-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
